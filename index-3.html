$("ls").innerHTML=R.map((r,i)=>`<button class="rt" data-i="${i}" style="--c:${r[2]}"><span class="ic"><svg viewBox="0 0 24 24">${r[3]}</svg></span><span class="tx"><b>${r[0]}</b><small>${r[1]} · +${PT} puan</small></span><span class="ck"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span></button>`).join("");
$("dt").textContent=new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
$("p0").insertAdjacentHTML("beforeend",'<div class="jk" style="border:0"><button id="lo" style="margin:0 auto;padding:10px 18px">Çıkış yap</button></div>');
$("lo").onclick=()=>signOut(au);
function upBugun(){if(!uid||!P[uid])return;const days=mine(),d=gd(days,T0),n=d.r.length,L=lv(total(days));
$("cn").textContent=n+"/8";$("pr").style.strokeDashoffset=276.5*(1-n/8);$("lvn").textContent=L.L;$("lvb").style.width=L.cur/L.need*100+"%";$("xp").textContent=L.cur+"/"+L.need+" XP";
$("sk").textContent=streak(days)+" gün seri";$("wp").textContent=wkp(days);$("jl").textContent=JK-jused(days);$("jb").textContent=d.j?"Geri al":"Joker";
$("sub").textContent=d.j?"Joker günü, zincir güvende":okd(d)?"Zincir güvende":(MIN-n)+" tane daha, zincir güvende";
document.querySelectorAll(".rt").forEach((b,i)=>{b.classList.toggle("on",d.r.includes(i));b.classList.toggle("lk",!!d.j)});
$("wk").innerHTML=WK.map((k,i)=>{const x=gd(days,k),ok=okd(x);return`<div class="dy ${i===ti?"now":ok?"ok":""}">${dn[i]}<i>${i===ti?x.r.length:ok?CK:(i<ti?x.r.length||"":"")}</i></div>`}).join("")}
function confetti(n){for(let i=0;i<n;i++){const e=document.createElement("i");e.className="cf";e.style.cssText=`left:${Math.random()*100}vw;background:hsl(${Math.random()*360},85%,60%);animation-delay:${Math.random()*.3}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}}
function celebrate(t,m){confetti(60);const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="mdl"><h1>${t}</h1><p>${m}</p><button>Devam</button></div>`;o.querySelector("button").onclick=()=>o.remove();document.body.appendChild(o)}
function popup(b){const r=b.getBoundingClientRect(),p=document.createElement("div");p.className="pt";p.textContent="+"+PT;p.style.left=r.right-60+"px";p.style.top=r.top+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),900)}
$("ls").addEventListener("click",async e=>{const b=e.target.closest(".rt");if(!b||!uid||!P[uid])return;const i=+b.dataset.i,days=mine(),d=gd(days,T0);
if(d.j){$("sub").textContent="Bugün joker günü, önce geri al";return}
const L0=lv(total(days)).L,add=!d.r.includes(i),nr=add?[...d.r,i]:d.r.filter(x=>x!==i),nd={...days,[T0]:{r:nr,j:0}};
if(add)popup(b);await save(T0,{r:nr,j:0});
if(add){const L1=lv(total(nd)).L;if(L1>L0)celebrate("Seviye "+L1+"!","Yeni seviyeye ulaştın");else if(nr.length===R.length)celebrate("Harika gün!","Bugün tüm rutinleri tamamladın");else if(nr.length===MIN)confetti(18)}});
$("jb").onclick=async()=>{if(!uid||!P[uid])return;const days=mine(),d=gd(days,T0);if(d.j)await save(T0,{r:d.r,j:0});else if(jused(days)>=JK){$("sub").textContent="Bu ay joker hakkın bitti"}else await save(T0,{r:d.r,j:1})};
function rank(){const ps=Object.values(P).filter(p=>p.team),ts=TM.map(t=>({...t,s:ps.filter(p=>p.team===t.id).reduce((a,p)=>a+wkp(p.days),0),k:ps.filter(p=>p.team===t.id).length})).sort((a,b)=>b.s-a.s),mx=ts[0].s||1,us=[...ps].sort((a,b)=>wkp(b.days)-wkp(a.days));
return`<div class="hd2"><div class="date">Bu hafta</div><h1>Sıralama</h1><p>Takımlar ve bireysel puanlar</p></div>
<div class="cd"><h3>Takım yarışı</h3>${ts.map((t,i)=>`<div class="tr" style="--c:${t.h}"><div class="l"><span><span class="md">${i+1}</span>${t.e} ${t.n} <small style="color:var(--mu)">(${t.k})</small></span><span>${t.s}</span></div><div class="b"><i style="width:${t.s/mx*100}%"></i></div></div>`).join("")}</div>
<div class="gift"><b>Haftanın ödül ve görevi</b><p>🏆 ${REW[WN%3]}</p><p>🎲 ${PEN[WN%3]}</p></div>
<div class="cd"><h3>Bireysel</h3>${us.map((u,i)=>`<div class="rw"><span class="md">${i+1}</span>${av(u.name,u.team)}<div class="tx"><b class="n">${esc(u.name)}</b><br><small>${th(u.team).n}</small></div><span class="pts">${wkp(u.days)}</span></div>`).join("")||'<div class="mu">Henüz kimse yok</div>'}</div><div style="height:12px"></div>`}
function chain(){const ps=Object.values(P).filter(p=>p.team).sort((a,b)=>streak(b.days)-streak(a.days)),td=ps.filter(p=>okd(gd(p.days,T0))).length;
return`<div class="hd2" style="padding-bottom:40px"><div class="date">Ortak tablo</div><h1>Zincir</h1><p>Herkesin haftası tek yerde</p></div>
<div class="sm"><div><b>${td}/${ps.length}</b><small>bugün tamamladı</small></div><div><b>${Math.max(0,...ps.map(p=>streak(p.days)))}</b><small>en uzun seri</small></div></div>
<div class="cd"><div class="hdr">${dn.map(x=>`<span>${x}</span>`).join("")}</div>${ps.map(u=>`<div class="rw" style="padding:7px 0">${av(u.name,u.team)}<div class="dots">${WK.map((k,i)=>{const d=gd(u.days,k),v=i>ti?-1:d.j?2:okd(d)?1:0;return`<span class="dot ${v===1?"y":v===2?"j":v<0?"f":""}"></span>`}).join("")}</div><span class="fs">${FL}${streak(u.days)}</span></div>`).join("")}<div class="mu" style="margin:10px 0 0;font-size:12px;text-align:center">Yeşil: hedef tamam · Turuncu: joker günü</div></div><div style="height:12px"></div>`}
const pg=[null,rank,chain];
function go(i){tab=i;document.querySelectorAll(".pg").forEach((e,k)=>e.hidden=k!==i);document.querySelectorAll("#nv a").forEach((e,k)=>e.classList.toggle("on",k===i));if(pg[i])$("p"+i).innerHTML=pg[i]();window.scrollTo(0,0)}
document.querySelectorAll("#nv a").forEach((a,i)=>a.onclick=()=>go(i));
function refresh(){if(!uid)return;const m=P[uid];if(!m){status("Hesap hazırlanıyor…");if(!creating&&au.currentUser){creating=true;const n=pendingName||(au.currentUser.email||"").split("@")[0];setDoc(doc(db,"players",uid),{name:n,team:null,days:{}}).catch(e=>{creating=false;status("Kayıt yazılamadı: "+(e.code||e.message),true)})}return}if(!m.team){showTeam();return}$("lg").hidden=true;upBugun();if(tab>0&&pg[tab])$("p"+tab).innerHTML=pg[tab]()}

unsub=onSnapshot(collection(db,"players"),s=>{P={};s.forEach(d=>P[d.id]=d.data());refresh()},e=>{status("Veri okunamadı: "+(e.code||e.message),true)})});
showLogin();
</script></body></html>
